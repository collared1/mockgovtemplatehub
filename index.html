<html>
  <head>
    <style>
      html, body {
        background-color: black;
        font-family: sans-serif;
        color: white;
      }
      .mainHeaders {
        width: 100%;
        text-align: center;
      }
      h1 {
        margin-bottom: 5px;
      }
      .templateBoxes {
        display: grid;
        width: 100%;
        grid-template-columns: repeat(4, 1fr);
      }
      .templateBox {
        height: 30vh;
        padding: 10px;
      }
      .templateBox h1 {
        border-bottom: 2px solid white;
      }
      .getButton {
        width: 100%;
        height: 30%;
        font-weight: bold;
        display: flex;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        font-size: 30px;
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <div class="mainHeaders">
      <h1>MockGov Template Hub</h1>
      <h3>Created by c0llared_</h3>
      <div class="templateBoxes">

        </div>
